[package]
name = "chat-game-overlay"
version = "0.0.1"
edition = "2024"
description = "Twitch-Chat als transparentes Overlay immer im Vordergrund über dem Spiel"
authors = ["areadox"]

[dependencies]
eframe = { version = "0.37.0", features = ["persistence"] }
global-hotkey = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
