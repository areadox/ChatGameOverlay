name: Build

# Baut bei jedem Push die Programme (als Download unter „Actions“).
# Ein GitHub-Release entsteht nur, wenn ein Tag wie v0.0.1 gepusht wird.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: chat-game-overlay.exe
            asset: ChatGameOverlay-windows.exe
          - os: ubuntu-latest
            file: chat-game-overlay
            asset: ChatGameOverlay-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - name: Tests
        run: cargo test --release
      - name: Bauen
        run: cargo build --release
      - name: Umbenennen
        shell: bash
        run: cp target/release/${{ matrix.file }} ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
